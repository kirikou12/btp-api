spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:btpdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET:0123456789012345678901234567890101234567890123456789012345678901}
    jwt-expiration-minutes: ${APP_SECURITY_JWT_EXPIRATION_MINUTES:120}
    cors-allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:*}
  documents:
    upload-dir: ${APP_DOCUMENTS_UPLOAD_DIR:.data/uploads}
