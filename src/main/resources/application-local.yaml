spring:
  flyway:
    enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/btpdb
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: false
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET:0123456789012345678901234567890101234567890123456789012345678901}
    jwt-expiration-minutes: ${APP_SECURITY_JWT_EXPIRATION_MINUTES:120}
    cors-allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:*}
