spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  h2:
    console:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  error:
    include-message: never
    include-binding-errors: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET}
    jwt-expiration-minutes: ${APP_SECURITY_JWT_EXPIRATION_MINUTES:120}
    cors-allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:*}
  documents:
    upload-dir: ${APP_DOCUMENTS_UPLOAD_DIR:/app/data/uploads}
