spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  application:
    name: btp-api
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: ${APP_DOCUMENTS_MAX_FILE_SIZE:20MB}
      max-request-size: ${APP_DOCUMENTS_MAX_REQUEST_SIZE:20MB}

server:
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  project:
    stage:
      max-in-progress-per-project: ${APP_PROJECT_STAGE_MAX_IN_PROGRESS_PER_PROJECT:6}
